# Block AI crawlers (Googlebot / Bingbot are intentionally NOT listed)
map $http_user_agent $bad_bot {
  default 0;
  ~*(GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|PerplexityBot|Bytespider|Google-Extended|Amazonbot|Applebot-Extended|cohere|Diffbot|ImagesiftBot|meta-externalagent|Scrapy|python-requests|HeadlessChrome|curl|wget) 1;
}
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
  listen 80;
  if ($bad_bot) { return 403; }
  add_header X-Robots-Tag "noai, noimageai" always;
  add_header X-Content-Type-Options nosniff always;

  # Built React shell, fetched by the API to build server-rendered pages
  location = /__shell.html { alias /usr/share/nginx/html/index.html; }

  location /api/ {
    limit_req zone=perip burst=30 nodelay;
    proxy_pass http://api:8000;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
  }

  # Server-rendered pages for SEO. If the API is down, fall back to the plain SPA.
  location = / {
    limit_req zone=perip burst=30 nodelay;
    proxy_pass http://api:8000/ssr/home;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    error_page 502 503 504 =200 /index.html;
  }
  location /place/ {
    limit_req zone=perip burst=30 nodelay;
    proxy_pass http://api:8000/ssr/place/;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Host $host;
    error_page 502 503 504 =200 /index.html;
  }
  location = /robots.txt  { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /sitemap.xml { proxy_pass http://api:8000; proxy_set_header X-Forwarded-For $remote_addr; }

  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
