apiVersion: v1
kind: Namespace
metadata: { name: bharat }
---
apiVersion: v1
kind: Secret
metadata: { name: app-secrets, namespace: bharat }
stringData:   # use Sealed Secrets / External Secrets in production
  DATABASE_URL: mysql+pymysql://app:CHANGE_ME@mysql:3306/bharat?charset=utf8mb4
  MYSQL_PASSWORD: CHANGE_ME
  MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: CHANGE_ME_64_CHARS
  ANTHROPIC_API_KEY: CHANGE_ME
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: bharat }
spec: { clusterIP: None, selector: { app: mysql }, ports: [{ port: 3306 }] }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql, namespace: bharat }
spec:
  serviceName: mysql
  replicas: 1   # for production prefer a managed DB (RDS / Cloud SQL)
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_DATABASE, value: bharat }
            - { name: MYSQL_USER, value: app }
            - { name: MYSQL_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_PASSWORD } } }
            - { name: MYSQL_ROOT_PASSWORD, valueFrom: { secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD } } }
          ports: [{ containerPort: 3306 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: bharat }
spec: { selector: { app: redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: bharat }
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec: { containers: [{ name: redis, image: "redis:7-alpine", ports: [{ containerPort: 6379 }] }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: bharat }
spec:
  replicas: 2
  strategy: { rollingUpdate: { maxUnavailable: 0, maxSurge: 1 } }
  selector: { matchLabels: { app: api } }
  template:
    metadata:
      labels: { app: api }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "8000", prometheus.io/path: /metrics }
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/bharat-api:latest
          envFrom: [{ secretRef: { name: app-secrets } }]
          ports: [{ containerPort: 8000 }]
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: bharat }
spec: { selector: { app: api }, ports: [{ port: 8000 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: bharat }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }
  minReplicas: 2
  maxReplicas: 10
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: worker, namespace: bharat }
spec:
  replicas: 2
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      containers:
        - name: worker
          image: YOUR_REGISTRY/bharat-api:latest
          command: ["celery","-A","app.tasks.celery","worker","--loglevel=info","--concurrency=4"]
          envFrom: [{ secretRef: { name: app-secrets } }]
          resources: { requests: { cpu: 200m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: web, namespace: bharat }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec: { containers: [{ name: web, image: "YOUR_REGISTRY/bharat-web:latest", ports: [{ containerPort: 80 }] }] }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: bharat }
spec: { selector: { app: web }, ports: [{ port: 80 }] }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bharat
  namespace: bharat
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls: [{ hosts: [bharatexplorer.example.com], secretName: bharat-tls }]
  rules:
    - host: bharatexplorer.example.com
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 80 } } } }
